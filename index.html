<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب محاصيل صُوَاع</title>
    <style>
        :root { --primary: #6f4e37; --bg: #fdfaf7; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 480px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); border-top: 6px solid var(--primary); }
        h2 { color: var(--primary); text-align: center; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; }
        input, select, button { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
        
        /* تنسيق الصورة */
        .image-container { text-align: center; margin: 20px 0; min-height: 150px; display: flex; justify-content: center; align-items: center; background: #f9f9f9; border-radius: 10px; overflow: hidden; }
        #productImage { max-width: 100%; max-height: 200px; display: none; transition: transform 0.3s; }
        #productImage.show { display: block; }
        
        .price-tag { background: #f0ebe5; padding: 12px; border-radius: 8px; margin-top: 10px; text-align: center; font-weight: bold; color: var(--primary); display: none; }
        button { background: var(--primary); color: white; border: none; margin-top: 20px; cursor: pointer; font-weight: bold; }
        #msg { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>طلب محاصيل صُوَاع ☕</h2>
    
    <div class="image-container">
        <img id="productImage" src="" alt="صورة المحصول">
        <span id="placeholderText">اختر محصولاً لرؤية الصورة</span>
    </div>

    <form id="orderForm">
        <label>الاسم الكامل</label>
        <input type="text" id="name" placeholder="أدخل اسمك" required>

        <label>اختر المحصول</label>
        <select id="coffeeType" onchange="updateUI()" required>
            <option value="" data-price="0" data-img="">-- اختر المحصول --</option>
            <option value="كينيا تشيروتو" data-price="63" data-img="https://suwaab2b.com/path-to-kenya-image.jpg">كينيا تشيروتو (63 ريال)</option>
            <option value="هندوراس قيشا" data-price="65" data-img="https://suwaab2b.com/path-to-geisha-image.jpg">هندوراس قيشا (65 ريال)</option>
            <option value="إثيوبيا قوجي" data-price="50" data-img="https://suwaab2b.com/path-to-goji-image.jpg">إثيوبيا قوجي (50 ريال)</option>
            <option value="إثيوبيا همبيلا" data-price="50" data-img="https://suwaab2b.com/path-to-hambela-image.jpg">إثيوبيا همبيلا (50 ريال)</option>
        </select>

        <label>الكمية</label>
        <input type="number" id="quantity" value="1" min="1" onchange="updateUI()" required>

        <div id="priceDisplay" class="price-tag"></div>

        <button type="submit" id="submitBtn">تأكيد الطلب</button>
    </form>
    <div id="msg"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwVLJoK34zFtvdVeXLNhoonx7sSVy8wfFIDwvo0xUII0zqE632jtwIMKX4QqxwoIohd5Q/exec';

    function updateUI() {
        const select = document.getElementById('coffeeType');
        const selectedOption = select.options[select.selectedIndex];
        
        const price = selectedOption.getAttribute('data-price');
        const imgUrl = selectedOption.getAttribute('data-img');
        const qty = document.getElementById('quantity').value;
        
        const imgElement = document.getElementById('productImage');
        const placeholder = document.getElementById('placeholderText');
        const priceDisplay = document.getElementById('priceDisplay');

        // تحديث الصورة
        if (imgUrl) {
            imgElement.src = imgUrl;
            imgElement.classList.add('show');
            placeholder.style.display = 'none';
        } else {
            imgElement.classList.remove('show');
            placeholder.style.display = 'block';
        }

        // تحديث السعر
        if (price > 0) {
            priceDisplay.style.display = 'block';
            priceDisplay.innerHTML = `الإجمالي: ${price * qty} ريال`;
        } else {
            priceDisplay.style.display = 'none';
        }
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // كود الإرسال إلى Google Sheets (كما في الرد السابق)
    });
</script>

</body>
</html>
